package:
  name: automation-service
  dependencies:
    - aff
    - aff-promise
    - argonaut
    - argonaut-codecs
    - arrays
    - bifunctors
    - colors
    - console
    - control
    - datetime
    - debug
    - effect
    - either
    - elmish
    - elmish-html
    - enums
    - foldable-traversable
    - foreign
    - foreign-object
    - integers
    - js-date
    - js-uri
    - lists
    - maybe
    - now
    - nullable
    - numbers
    - ordered-collections
    - parsing
    - prelude
    - profunctor-lenses
    - record
    - refs
    - spec
    - strings
    - tuples
    - typelevel-prelude
    - uri
    - web-dom
    - web-events
    - web-html
    - web-socket
    - web-storage
  bundle:
    module: Main
    outfile: "index.js"
    platform: browser
    type: "app"
  test:
    main: Test.Main
    dependencies:
      - spec-node

workspace:
  extraPackages:
    # elmish 0.15.x pairs with elmish-html v0.14.0, which holds the
    # react-dom-facing pieces (Elmish.HTML.Boot etc.); it is not yet in
    # the registry package set, so pin it from git as upstream elmish does
    elmish-html:
      git: https://github.com/collegevine/purescript-elmish-html.git
      ref: v0.14.0
  packageSet:
    registry: 72.0.0
